[package]
name = "s3-algo"
description = "High-performance algorithms for batch operations to Amazon S3"
version = "0.7.3"
authors = ["Erlend Langseth <3rlendhl@gmail.com>"]
license = "MIT"
edition = "2018"

documentation = "https://docs.rs/s3-algo/"
repository = "https://github.com/openanalytics/s3-algo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures = "0.3.31"
futures-stopwatch = "0.3.0"
futures-retry = "0.6.0"
tokio = {version = "1.49", features = ["time", "fs", "macros", "io-util", "sync", "rt-multi-thread"]}
tokio-util = {version = "0.7.18", features = ["codec"]}
bytes = "1.2.1"
serde = {optional = true, version = "1.0.130", features = ["derive"]}
snafu = {version = "0.6.1", features = ["futures"]}
walkdir = "2.2.9"

aws-sdk-s3 = "1.120.0"
aws-config = "1.8.12"
aws-smithy-http = "0.62.6"
aws-smithy-async = "1.2.7"
aws-smithy-types-convert = {version = "0.60.11", features = ["convert-streams"]}

[target.'cfg(windows)'.dependencies]
# only needed on windows for substituting \ with / in paths
path-slash = "0.2.1"

[dev-dependencies]
tempdir = "0.3.7"
multi-default-trait-impl = "0.1.2"
rand = "0.8.5"
clap = "4.5"

[features]
default = ["serde1"]
serde1 = ["serde"]
